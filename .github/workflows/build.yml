name: Build

on:
  push:
    # `testing` as well as `main`: the prereleases are cut from that branch, and
    # it had no CI at all - every 0.0.4.x-testing tag was the first time any of
    # this ran against the commit it was built from.
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # 7-Zip and bsdtar: the two archivers the plugin unpacks the payload with.
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full libarchive-tools

      # The UI's controls, types, ranges and help text are derived from the
      # comments in defaults/OptiScaler.reference.ini. Regenerating here proves
      # the committed output still matches its source.
      - name: Check generated schema is up to date
        run: |
          python3 scripts/generate_schema.py
          git diff --exit-code -- src/config/generatedSchema.ts py_modules/optiscaler/schema_generated.py

      # The ASI reads OptiScaler's memory at offsets the compiler computes from
      # this mirror, so a stale one is a silently inert live-control feature.
      - name: Check generated ASI layout is up to date
        run: |
          python3 scripts/generate_asi_layout.py
          git diff --exit-code -- asi/generated/config_mirror.h py_modules/optiscaler/live_fields.json

      # Nightly fork: no OptiScaler archive is committed. Everything below runs
      # against the newest nightly, the one the next release would ship, so a
      # nightly that breaks the plugin fails here, on the push, not on the Deck.
      # The schema is regenerated from that nightly's INI (the check above held
      # the committed snapshot to the committed INI).
      - name: Bundle the newest OptiScaler nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bundle_nightly.py --latest
          python3 scripts/generate_schema.py
          git diff --stat

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Steam Deck FSR4 lifecycle
        run: python3 scripts/test_fsr4.py

      # A failed or interrupted install must leave the game folder as it was.
      - name: Install safety
        run: python3 scripts/test_install.py

      - name: In-plugin updater
        run: python3 scripts/test_update.py

      # Includes check_version_pin() (the archive in bin/ is the one
      # constants.py pins) and the real-payload install/upgrade/uninstall.
      - name: Backend selftest
        run: python3 scripts/selftest.py

      # The harnesses assert by printing; "React errors/warnings: 0" is the pass
      # condition, so the output is checked rather than the exit code.
      - name: UI harness
        run: |
          set -o pipefail
          HARNESS=run.tsx node testharness/build-and-run.mjs 2>&1 | tee harness.log
          grep -q "React errors/warnings: 0" harness.log
          # run.tsx reports what it saw as "<expectation>: true"; one that
          # printed false is a failed expectation, not just a log line.
          if grep -E ": false$" harness.log; then exit 1; fi

      - name: All-options harness
        run: |
          set -o pipefail
          HARNESS=all-options.tsx node testharness/build-and-run.mjs 2>&1 | tee all-options.log
          grep -q "real React errors: 0" all-options.log

      # This one exits non-zero on a failed check, so its status is enough.
      - name: Live-controls harness
        run: HARNESS=live-fields.tsx node testharness/build-and-run.mjs

      - name: Package
        run: python3 scripts/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: decky-optiscaler-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
