name: Bundle OptiScaler nightly

# optiscaler/OptiScaler-nightly publishes at 04:00 UTC; run after it. Each run
# publishes when there is a nightly no release carries yet, when main has
# commits since the last release, or when forced; it then downloads and bundles
# the newest nightly (no OptiScaler archive is committed to the repo). Versions are <base>-nightly.<date>.<run number>, so
# every published build is its own release. It runs the
# same checks as build.yml and publishes a release with the plugin zip (nothing
# is committed back to the branch). A nightly that breaks the checks is not
# released -- the run fails and the previous build stays current.
#
# Releases are full releases (not prereleases) under a fixed asset name, so the
# newest one is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/decky-optiscaler-nightly.zip
# which is what Decky's "Install Plugin from URL" wants.
#
# Run it by hand with "Release the current build" ticked to publish the current
# main with the newest nightly without waiting for anything new.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release the current build even if no newer nightly exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes list this fork's commits since
      # its previous nightly release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full libarchive-tools
          pnpm install --frozen-lockfile

      - name: Decide, and bundle the newest nightly
        id: bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release when there is a nightly no release carries yet, when main
          # has commits the last release does not, or when forced.
          nightly=$(gh api 'repos/optiscaler/OptiScaler-nightly/releases?per_page=1' --jq '.[0].tag_name')
          date="${nightly##*-}"
          released=$(git tag --list "v*-nightly.${date}*" | head -1)
          last=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -1)
          changed=false
          if [ -z "$last" ] || [ "$(git rev-list -n1 "$last")" != "$(git rev-parse HEAD)" ]; then
            changed=true
          fi
          echo "newest nightly: $nightly (released as: ${released:-not yet})"
          echo "last release: ${last:-none}, fork changed since: $changed"
          if [ -n "$released" ] && [ "$changed" = "false" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "nothing new to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # No archive is committed: every release bundles the newest nightly.
          python3 scripts/bundle_nightly.py --latest
          python3 scripts/generate_schema.py
          # Every published build gets its own version: <base>-nightly.<date>.<run>.
          # The in-plugin updater compares versions, so a fork-only change on the
          # same nightly has to read as new.
          version="$(node -p 'require("./package.json").version').${{ github.run_number }}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck, build and test
        if: steps.bundle.outputs.release == 'true'
        run: |
          npx tsc --noEmit
          pnpm build
          set -o pipefail
          # Logs feed the "checks this release passed" part of the notes.
          python3 scripts/test_fsr4.py 2>&1 | tee fsr4.log
          python3 scripts/selftest.py 2>&1 | tee selftest.log
          python3 scripts/test_install.py 2>&1 | tee install.log
          python3 scripts/test_update.py
          HARNESS=run.tsx node testharness/build-and-run.mjs 2>&1 | tee harness.log
          grep -q "React errors/warnings: 0" harness.log
          if grep -E ": false$" harness.log; then exit 1; fi
          HARNESS=all-options.tsx node testharness/build-and-run.mjs 2>&1 | tee all-options.log
          grep -q "real React errors: 0" all-options.log
          HARNESS=live-fields.tsx node testharness/build-and-run.mjs

      - name: Package
        if: steps.bundle.outputs.release == 'true'
        run: python3 scripts/package.py

      - name: Release
        if: steps.bundle.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          # Nothing is committed back: each nightly archive is ~70 MB and would
          # pile up in git history daily. The release zip carries it.
          # package.py names the zip after plugin.json's name.
          cp out/*.zip decky-optiscaler-nightly.zip
          # The in-plugin updater passes this to Decky's installer, which
          # refuses a zip whose SHA-256 does not match.
          sha256sum decky-optiscaler-nightly.zip | cut -d' ' -f1 > decky-optiscaler-nightly.zip.sha256
          # What is inside, OptiScaler's own changes in this nightly, this
          # fork's commits since its last release, and the test counts.
          python3 scripts/release_notes.py --zip decky-optiscaler-nightly.zip \
            --selftest-log selftest.log --fsr4-log fsr4.log --install-log install.log > release-notes.md
          cat release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Re-run for the same nightly: replace the zip and refresh the notes.
            gh release upload "v$VERSION" decky-optiscaler-nightly.zip \
              decky-optiscaler-nightly.zip.sha256 --clobber
            gh release edit "v$VERSION" --notes-file release-notes.md --latest
            exit 0
          fi
          gh release create "v$VERSION" decky-optiscaler-nightly.zip decky-optiscaler-nightly.zip.sha256 \
            --target "$(git rev-parse HEAD)" --latest --title "Decky OptiScaler $VERSION" \
            --notes-file release-notes.md
