name: Bundle OptiScaler nightly

# optiscaler/OptiScaler-nightly publishes at 04:00 UTC; run after it. Each run
# bundles the newest nightly if it is not the one already in bin/, runs the
# same checks as build.yml and publishes a release with the plugin zip (nothing
# is committed back to the branch). A nightly that breaks the checks is not
# released -- the run fails and the previous build stays current.
#
# Releases are full releases (not prereleases) under a fixed asset name, so the
# newest one is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/decky-optiscaler-nightly.zip
# which is what Decky's "Install Plugin from URL" wants.
#
# Run it by hand with "release current build" ticked to publish what is in bin/
# without waiting for a newer nightly.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release the current build even if no newer nightly exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes list this fork's commits since
      # its previous nightly release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          pnpm install --frozen-lockfile

      - name: Bundle the newest nightly
        id: bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/bundle_nightly.py --latest --if-newer
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            [ "$code" = 0 ] || exit "$code"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            python3 scripts/generate_schema.py
          fi
          if [ "$code" = 0 ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Typecheck, build and test
        if: steps.bundle.outputs.release == 'true'
        run: |
          npx tsc --noEmit
          pnpm build
          set -o pipefail
          # Logs feed the "checks this release passed" part of the notes.
          python3 scripts/test_fsr4.py 2>&1 | tee fsr4.log
          python3 scripts/selftest.py 2>&1 | tee selftest.log
          HARNESS=run.tsx node testharness/build-and-run.mjs 2>&1 | tee harness.log
          grep -q "React errors/warnings: 0" harness.log
          HARNESS=all-options.tsx node testharness/build-and-run.mjs 2>&1 | tee all-options.log
          grep -q "real React errors: 0" all-options.log
          HARNESS=live-fields.tsx node testharness/build-and-run.mjs

      - name: Package
        if: steps.bundle.outputs.release == 'true'
        run: python3 scripts/package.py

      - name: Release
        if: steps.bundle.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          # Nothing is committed back: each nightly archive is ~70 MB and would
          # pile up in git history daily. The release zip carries it; main keeps
          # the last hand-bundled build, and the next run bundles from there.
          cp "out/Decky OptiScaler.zip" decky-optiscaler-nightly.zip
          # What is inside, OptiScaler's own changes in this nightly, this
          # fork's commits since its last release, and the test counts.
          python3 scripts/release_notes.py --zip decky-optiscaler-nightly.zip \
            --selftest-log selftest.log --fsr4-log fsr4.log > release-notes.md
          cat release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Re-run for the same nightly: replace the zip and refresh the notes.
            gh release upload "v$VERSION" decky-optiscaler-nightly.zip --clobber
            gh release edit "v$VERSION" --notes-file release-notes.md --latest
            exit 0
          fi
          gh release create "v$VERSION" decky-optiscaler-nightly.zip \
            --target "$(git rev-parse HEAD)" --latest --title "Decky OptiScaler $VERSION" \
            --notes-file release-notes.md
